name: Build Windows EXE
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: packaging/requirements-build.txt
      - name: Install build dependencies
        run: python -m pip install -r packaging/requirements-build.txt
      - name: Test server
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Build executable
        run: python -m PyInstaller --clean --noconfirm packaging/ktp-studio.spec
      - name: Smoke test HTTPS executable
        run: python packaging/smoke_exe.py dist/KTPStudioServer.exe
      - name: Package Windows service
        run: |
          $ErrorActionPreference = 'Stop'
          $package = 'dist/PENAPRINT-TOOLKIT-Windows-x64'
          New-Item -ItemType Directory -Path $package | Out-Null
          Copy-Item dist/KTPStudioServer.exe $package
          $csc = Join-Path $env:SystemRoot 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          $panelSource = Join-Path $env:GITHUB_WORKSPACE 'windows\ControlPanel.cs'
          if (-not (Test-Path -LiteralPath $panelSource -PathType Leaf)) {
            throw "Source panel tidak ditemukan: $panelSource. Pastikan windows/ControlPanel.cs ikut di-commit."
          }
          $panelSource = (Resolve-Path -LiteralPath $panelSource).ProviderPath
          $packagePath = (Resolve-Path -LiteralPath $package).ProviderPath
          $panelOutput = Join-Path $packagePath 'PENAPRINT-ControlPanel.exe'
          $compilerArguments = @(
            '/nologo', '/target:winexe', "/out:$panelOutput",
            '/reference:System.Windows.Forms.dll', '/reference:System.Drawing.dll',
            '/reference:System.ServiceProcess.dll', $panelSource
          )
          & $csc @compilerArguments
          if ($LASTEXITCODE -ne 0) { throw 'Control Panel compilation failed' }
          if (-not (Test-Path -LiteralPath $panelOutput -PathType Leaf)) { throw 'Control Panel EXE was not produced' }
          Invoke-WebRequest 'https://github.com/winsw/winsw/releases/download/v2.12.0/WinSW-x64.exe' -OutFile "$package/KTPStudio.exe"
          Invoke-WebRequest 'https://raw.githubusercontent.com/winsw/winsw/v2.12.0/LICENSE.txt' -OutFile "$package/WinSW-LICENSE.txt"
          Copy-Item windows/Install-ExeService.ps1 "$package/Install-Service.ps1"
          Copy-Item windows/Open-Portal.ps1,windows/Remove-Service.ps1,windows/Setup-Service.ps1,windows/Uninstall-SetupService.ps1 $package
          Copy-Item windows/EXE-README.md "$package/README.md"
          Copy-Item vendor/qrcode.LICENSE "$package/QRCode-LICENSE.txt"
          & "$env:SystemRoot/System32/WindowsPowerShell/v1.0/powershell.exe" -NoProfile -NonInteractive -ExecutionPolicy Bypass -File packaging/validate_powershell.ps1 -Package $package
          if ($LASTEXITCODE -ne 0) { throw 'Windows PowerShell 5.1 syntax validation failed' }
          & "$env:SystemRoot/System32/WindowsPowerShell/v1.0/powershell.exe" -NoProfile -NonInteractive -ExecutionPolicy Bypass -File packaging/test_windows_acl.ps1 -Installer "$package/Install-Service.ps1"
          if ($LASTEXITCODE -ne 0) { throw 'Windows folder permission test failed' }
          Get-ChildItem "$package/*.exe" | Get-FileHash -Algorithm SHA256 | Format-Table -AutoSize | Out-String | Set-Content "$package/SHA256SUMS.txt"
          Compress-Archive -Path "$package/*" -DestinationPath dist/PENAPRINT-TOOLKIT-Windows-x64.zip
      - name: Build Windows installer
        run: |
          $compiler = "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe"
          if (-not (Test-Path $compiler)) { throw 'Inno Setup 6 tidak tersedia pada runner.' }
          & $compiler packaging/windows-installer.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed' }
      - name: Smoke test installer and uninstall
        run: |
          $setupLog = Join-Path $env:RUNNER_TEMP 'penaprint-setup.log'
          $setup = Start-Process -FilePath dist/PENAPRINT-TOOLKIT-Setup-x64.exe -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /IP=127.0.0.1 /LOG=`"$setupLog`"" -Wait -PassThru
          if ($setup.ExitCode -ne 0) {
            & ./packaging/installer_diagnostics.ps1
            throw "Installer failed: $($setup.ExitCode). Error pemasangan ditampilkan tepat di atas pesan ini."
          }
          $service = Get-Service KTPStudio -ErrorAction SilentlyContinue
          if (-not $service) { throw 'Installer exited without registering KTPStudio. See installer diagnostics below.' }
          $service.WaitForStatus([System.ServiceProcess.ServiceControllerStatus]::Running, [TimeSpan]::FromSeconds(30))
          python packaging/check_service.py --root "$env:ProgramData/KTPStudio"
          if ($LASTEXITCODE -ne 0) { throw 'Installed HTTPS application failed' }
          $panelReport = Join-Path $env:RUNNER_TEMP 'penaprint-panel-test.log'
          $panel = Start-Process -FilePath "$env:ProgramFiles/PENAPRINT-TOOLKIT/PENAPRINT-ControlPanel.exe" -ArgumentList "--smoke-test `"$panelReport`"" -PassThru
          try {
            if (-not $panel.WaitForExit(30000)) { throw 'Control Panel timed out before completing UI verification' }
            if (Test-Path -LiteralPath $panelReport) { Get-Content -LiteralPath $panelReport | Write-Host }
            if ($panel.ExitCode -ne 0) { throw "Control Panel crashed or failed UI verification: exit $($panel.ExitCode). See panel report." }
            if (-not (Test-Path -LiteralPath $panelReport)) { throw 'Control Panel exited without a test report' }
            if (-not ((Get-Content -LiteralPath $panelReport -Raw).StartsWith('PASS:'))) { throw 'Control Panel did not confirm successful UI verification' }
          } finally {
            if (-not $panel.HasExited) { $panel.Kill(); $panel.WaitForExit() }
            $panel.Dispose()
          }
          $savedCert = Join-Path $env:RUNNER_TEMP 'penaprint-before-restart.crt'
          Copy-Item "$env:ProgramData/KTPStudio/.local-certs/server.crt" $savedCert
          Restart-Service KTPStudio -ErrorAction Stop
          python packaging/check_service.py --root "$env:ProgramData/KTPStudio" --expected-cert $savedCert
          if ($LASTEXITCODE -ne 0) { throw 'Service restart or certificate persistence failed' }
          $uninstall = Start-Process -FilePath "$env:ProgramFiles/PENAPRINT-TOOLKIT/unins000.exe" -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART' -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw 'Uninstall failed' }
          $deadline = (Get-Date).AddSeconds(30)
          while ((Get-Service KTPStudio -ErrorAction SilentlyContinue) -and (Get-Date) -lt $deadline) { Start-Sleep -Milliseconds 500 }
          if (Get-Service KTPStudio -ErrorAction SilentlyContinue) { throw 'Service was not removed' }
          if (Get-NetFirewallRule -Name KTPStudio-LAN -ErrorAction SilentlyContinue) { throw 'Firewall rule was not removed' }
      - name: Save panel verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PENAPRINT-ControlPanel-Verification
          path: |
            ${{ runner.temp }}/penaprint-panel-test.log
            ${{ runner.temp }}/penaprint-panel-test.log.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Installer diagnostics
        if: failure()
        run: ./packaging/installer_diagnostics.ps1
      - name: Save installer diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: PENAPRINT-Installer-Diagnostics
          path: ${{ runner.temp }}/penaprint-diagnostics/*.log
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: PENAPRINT-TOOLKIT-Installer
          path: dist/PENAPRINT-TOOLKIT-Setup-x64.exe
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: PENAPRINT-TOOLKIT-Windows-x64
          path: dist/PENAPRINT-TOOLKIT-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30
